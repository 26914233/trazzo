; Exportacion Android de Rebotazz.
; - "Android APK (prueba)": APK sin Gradle, para instalar a mano en un movil
;   (sin plugins: anuncios simulados en depuracion, compras desactivadas).
; - "Android Play (AAB)": con Gradle y los plugins de AdMob y Billing instalados
;   (docs/INTEGRACION_ANDROID.md). Gratis con anuncios y compras: pide red.
; Las claves de release van por variables de entorno, nunca aqui.

[preset.0]

name="Android APK (prueba)"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="datos/niveles.json"
exclude_filter="tests/*, docs/*, herramientas/*"
export_path="build/rebotazz.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0.0"
package/unique_name="com.thunderdarkness.rebotazz"
package/name="Rebotazz"
package/signed=true
package/app_category=0
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://arte/icono_android/principal_192.png"
launcher_icons/adaptive_foreground_432x432="res://arte/icono_android/frente_432.png"
launcher_icons/adaptive_background_432x432="res://arte/icono_android/fondo_432.png"
launcher_icons/adaptive_monochrome_432x432="res://arte/icono_android/monocromo_432.png"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=true
permissions/access_network_state=true
permissions/vibrate=true

