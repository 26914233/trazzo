<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07040c"/><stop offset=".45" stop-color="#26081a"/><stop offset=".8" stop-color="#8c1428"/><stop offset="1" stop-color="#d1364a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9c7"/><stop offset=".55" stop-color="#ff5a4d"/><stop offset="1" stop-color="#c3162f"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6a5a" stop-opacity=".55"/><stop offset="1" stop-color="#ff6a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb4a8" stop-opacity="0"/><stop offset=".6" stop-color="#ffb4a8" stop-opacity=".16"/><stop offset="1" stop-color="#ffb4a8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="540" cy="285" r="230" fill="url(#halo)"/>
  <circle cx="540" cy="285" r="112" fill="url(#sun)"/>
  <!-- lineas de tinta en el cielo -->
  <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2">
    <path d="M0 120H800M0 170H800M0 220H800"/>
  </g>
  <!-- montañas lejanas -->
  <path d="M0 380 130 300 210 350 330 260 450 360 560 300 690 370 800 320V600H0z" fill="#3a0f22" opacity=".85"/>
  <rect x="0" y="330" width="800" height="90" fill="url(#mist)"/>
  <path d="M0 440 90 380 200 430 320 350 470 440 600 390 720 440 800 410V600H0z" fill="#1d0a17"/>
  <rect x="0" y="410" width="800" height="80" fill="url(#mist)"/>
  <!-- torii -->
  <g transform="translate(150 330)" fill="#0c0509">
    <path d="M-62 14Q0 -2 62 14L72 4Q0 -18 -72 4z"/>
    <rect x="-52" y="18" width="104" height="9"/>
    <rect x="-42" y="18" width="12" height="108"/>
    <rect x="30" y="18" width="12" height="108"/>
    <rect x="-6" y="-8" width="12" height="26"/>
  </g>
  <path d="M0 500 140 456 250 480 370 450 520 492 800 440V600H0z" fill="#0a0508"/>
  <!-- samurái -->
  <g transform="translate(500 360)" fill="#050205">
    <path d="M-34 4 0 -36 34 4z"/>
    <ellipse cx="0" cy="3" rx="36" ry="5"/>
    <circle cx="0" cy="8" r="9"/>
    <path d="M-20 18Q0 10 20 18L30 84 -30 84z"/>
    <path d="M-30 84 -48 138 -28 138 -10 96 8 138 28 138 14 84z"/>
    <path d="M18 34 66 6" stroke="#050205" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- katana + corte -->
  <path d="M552 354 766 196" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M552 354 766 196" stroke="#ffd1c8" stroke-width="12" stroke-linecap="round" opacity=".5" filter="url(#blur)"/>
  <path d="M420 120 700 468" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".95"/>
  <path d="M420 120 700 468" stroke="#ff8d7f" stroke-width="14" stroke-linecap="round" opacity=".42" filter="url(#blur)"/>
  <!-- pétalos -->
  <g fill="#ffb4a8" opacity=".75" filter="url(#blur2)">
    <circle cx="300" cy="200" r="3"/><circle cx="360" cy="260" r="2.4"/><circle cx="690" cy="250" r="3"/>
    <circle cx="610" cy="130" r="2.2"/><circle cx="240" cy="300" r="2.6"/><circle cx="730" cy="360" r="2.8"/>
  </g>
</svg>
